name: Release

# Single-branch release pipeline modeled on khal-os/desktop.
#
# Two trigger paths into the same workflow:
#
#   1. push to main with a hand-bumped package.json (no [skip ci] marker)
#      -> auto-detect path: prepare reads package.json, checks if v${version}
#         tag exists, builds + publishes + creates GitHub Release if not.
#
#   2. workflow_dispatch with bump=patch|minor|major
#      -> bump job runs `npm version`, commits with [skip ci], tags, pushes.
#         prepare/build/release continue inline in the same workflow run.
#
# Bot-loop guard: bump commits carry [skip ci]. Push of those commits is
# filtered out by the prepare gate, so the bot's own push does not retrigger.
#
# Nothing here publishes to npm: that stopped at v3.0.0 (see version.yml).
# The npmjs.com Trusted Publisher entry still configured for the legacy
# `pgserve` package is unused. Distribution is GitHub Releases, signed by
# sign-attest.yml with cosign keyless OIDC.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write    # the bump job's "Kick build-tarballs" step calls
                    # `gh workflow run build-tarballs.yml` — creating a
                    # workflow_dispatch event needs actions:write or the
                    # default GITHUB_TOKEN gets HTTP 403 "Resource not
                    # accessible by integration" (Bug #3 follow-up: the
                    # dispatch step failed for v3.0.3 with exactly this).

jobs:
  # ---------------------------------------------------------------------------
  # Bump (workflow_dispatch only): npm version, commit [skip ci], tag, push.
  # ---------------------------------------------------------------------------
  bump:
    name: Bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${VERSION}"

      - name: Commit, tag, push
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          git add package.json
          git commit -m "[skip ci] release ${TAG}"
          git tag -a "${TAG}" -m "release ${TAG}"
          git push origin HEAD --follow-tags

      # BRIEF-v3-build-fix Bug #3: the bump commit carries `[skip ci]` (a
      # required bot-loop guard — the prepare gate filters that same marker
      # so the push of this commit does NOT retrigger release.yml). But
      # GitHub's skip-ci suppression ALSO applies to the *tag* push event,
      # so `build-tarballs.yml` (on: push tags v*) never fires → the
      # signed-release chain (build-tarballs → sign-attest →
      # release-publish) silently never starts. This hit v2.7.0, v3.0.0,
      # v3.0.2 (all tagged, none published anything).
      #
      # Fix: dispatch build-tarballs explicitly against the freshly-pushed
      # tag. workflow_dispatch is NOT subject to skip-ci, GITHUB_TOKEN is
      # permitted to start it, and `--ref ${TAG}` makes every job in the
      # chain check out the tagged tree. `[skip ci]` stays intact.
      #
      # `release=true` tells build-tarballs to keep going: it dispatches
      # sign-attest, which dispatches release-publish. Those two hops are
      # explicit for the same reason this one is — no `workflow_run` event
      # is raised for a run GITHUB_TOKEN started.
      - name: Kick build-tarballs for the tag (skip-ci-immune)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          # Tag refs need a beat to register before the API accepts --ref.
          for i in 1 2 3 4 5; do
            if gh workflow run build-tarballs.yml \
                 --ref "${TAG}" \
                 -f version="${VERSION}" \
                 -f release=true; then
              echo "Dispatched build-tarballs.yml @ ${TAG} (version=${VERSION})"
              exit 0
            fi
            echo "build-tarballs dispatch attempt ${i} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::could not dispatch build-tarballs.yml for ${TAG}"
          exit 1

  # ---------------------------------------------------------------------------
  # Prepare: resolve version, skip if tag already exists, build changelog.
  #
  # Gate handles both event types:
  #   - push:    bump is skipped; the !cancelled() && !failure() guard lets
  #              this job run regardless. The [skip ci] check filters the
  #              bot's own bump-commit push so it does not retrigger.
  #   - dispatch: bump succeeded; the workflow_dispatch branch of the OR
  #              short-circuits the [skip ci] check (the dispatch event
  #              itself does not carry the bump's commit message).
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    needs: bump
    if: |
      !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, '[skip ci]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
      changelog: ${{ steps.changelog.outputs.notes }}
      # Surface the resolved checkout-ref so downstream jobs (build, release)
      # can use it. They cannot reference `needs.bump.outputs.*` directly
      # because they only have `needs: prepare` (or [prepare, build]) — not
      # `bump` — in their needs context.
      ref: ${{ needs.bump.outputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On dispatch, check out the freshly-pushed tag; on push, the
          # triggering SHA already has the bumped package.json.
          # (Prepare cannot reference its own `outputs.ref` here — that's
          # only available to downstream jobs.)
          ref: ${{ needs.bump.outputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous release tag
        id: prev
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PREV=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD 2>/dev/null; then
            echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
            echo "Previous tag: ${PREV}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No previous tag reachable from HEAD"
          fi

      - name: Generate changelog
        id: changelog
        if: steps.ver.outputs.skip == 'false' && steps.prev.outputs.tag != ''
        run: |
          PREV="${{ steps.prev.outputs.tag }}"
          NOTES=$(git log --oneline "${PREV}..HEAD" --pretty="- %s" | head -50)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Echo the resolved outputs so downstream skip/no-skip decisions are
      # debuggable from the run log without re-running with step debug.
      - name: Debug resolved outputs
        run: |
          echo "version=${{ steps.ver.outputs.version }}"
          echo "tag=${{ steps.ver.outputs.tag }}"
          echo "skip=${{ steps.ver.outputs.skip }}"
          echo "prev=${{ steps.prev.outputs.tag }}"

  # ---------------------------------------------------------------------------
  # Build (sanity): matrix build of platform binaries.
  #
  # V3-2 npm departure: the npm `publish` job in version.yml has been
  # removed. This `build` step remains as a per-release sanity-build
  # gate; its artifacts are not currently consumed by any downstream
  # workflow.
  #
  # The reusable workflow filename `version.yml` is preserved because the
  # historical npm Trusted Publisher entry was bound to that path; once
  # the Trusted Publisher entry is fully retired at the registry level,
  # this file can be renamed or merged into release.yml.
  #
  # The `if:` uses `always() && needs.prepare.result == 'success' &&
  # needs.prepare.outputs.skip != 'true'`. This is the bulletproof pattern
  # for reusable-workflow callers when any upstream job in the `needs:`
  # chain was SKIPPED. With the simpler `needs.prepare.outputs.skip != 'true'`
  # alone, GH Actions silently evaluated the gate as false even though the
  # debug step in `prepare` proved the output was actually `'false'` — a
  # known GH Actions quirk: when a job's transitive `needs:` chain includes
  # a skipped job (here, `bump` is skipped on push events), the reusable-
  # workflow caller's expression evaluator treats `needs.<job>.outputs.<x>`
  # as null/missing regardless of the actual value.
  #
  # `always()` opts out of the implicit success() filter; the explicit
  # `result == 'success'` reinstates it correctly; the outputs check then
  # works as intended.
  # ---------------------------------------------------------------------------
  build:
    name: Build (sanity)
    needs: prepare
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/version.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      # `npm_tag` input is deprecated post-V3-2 (npm departure). The
      # publish job that consumed it has been removed; passing 'latest'
      # is harmless and kept here only to satisfy the still-required
      # parameter shape until version.yml's signature is simplified.
      npm_tag: latest
      # Use prepare.outputs.ref (which resolves to the bump-job tag on
      # dispatch, or `github.sha` on push). Build cannot reference
      # `needs.bump.*` directly — only `prepare` is in its `needs:` chain.
      # On the push path nobody creates the tag before this runs; the
      # SHA-based checkout works because the merge commit already has the
      # bumped package.json. The tag is pushed by the bump job (when
      # workflow_dispatch is used). GitHub Release creation flows through
      # `release-publish.yml` exclusively (Wave A PR-A2 race fix).
      #
      # V3-2 npm departure: the `publish` job that this workflow used to
      # call has been removed from version.yml. release.yml now only runs:
      #   bump (workflow_dispatch only) → prepare → build (sanity)
      # The cosign-signed GitHub Releases pipeline runs independently, each
      # hop an explicit workflow_dispatch at the tag:
      #   bump job → build-tarballs.yml → sign-attest.yml → release-publish.yml
      # See .genie/wishes/pgserve-singleton-no-proxy/SHARED-DESIGN.md
      # Decision #1 ("3.0 reserved for post-npm-departure cutover").
      #
      # KNOWN LIMITATION (Wave A PR-A2 follow-up): the push-to-main flow
      # NO LONGER creates a tag automatically. The dropped `release` job
      # was creating the tag via `gh release create v${VERSION}` against
      # HEAD; without it, push-event runs of release.yml will build but
      # produce no tag → no `build-tarballs → sign-attest →
      # release-publish` chain → no GitHub Release.
      #
      # Workaround until a tag-creation step lands: route releases via
      # workflow_dispatch (the bump job creates and pushes the tag, then
      # dispatches build-tarballs → sign-attest → release-publish).
      # This matches Felipe's current operational practice (all recent
      # v2.x releases were cut via workflow_dispatch, not push-to-main).
      ref: ${{ needs.prepare.outputs.ref }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Release job — REMOVED in Wave A PR-A2 (Mismatch 7 Option 1).
  #
  # Previously this job created the GitHub Release with the pgserve-*
  # single-file binaries. release-publish.yml ALSO creates a GitHub
  # Release on the same tag with the autopg-*.tar.gz tarballs +
  # cosign signing artifacts. Both ran `gh release create` without
  # cross-workflow idempotency → race:
  #   - if this job won: release-publish fell through to upload --clobber
  #     and the release ended up with BOTH naming conventions on the
  #     same tag (operator confusion)
  #   - if release-publish won: this job's gh release create failed with
  #     "already exists", turning the release.yml run red even though
  #     everything succeeded
  #
  # Option 1 (recommended by engineer DEEPER-AUDIT, accepted by Felipe):
  # drop this job entirely. release-publish.yml owns all GH-Releases
  # creation. release.yml retains only bump + prepare + build (sanity)
  # after the V3-2 npm-departure removed the npm publish step too.
  #
  # The single-file pgserve-* binaries previously attached here are NOT
  # currently re-attached by release-publish.yml — they're a development
  # artifact, not the canonical production distribution surface. If
  # operators need them, future PR-A3+ (D7 naming reconciliation) can
  # route them through release-publish.
  #
  # Tag creation on the WORKFLOW_DISPATCH path is unaffected — the
  # `bump` job creates and pushes the tag. sign-attest.yml dispatches
  # release-publish.yml at that tag once signing verifies, and
  # release-publish creates the GitHub Release with signed artifacts.
  #
  # Tag creation on the PUSH path is NOT covered here anymore — see
  # known limitation in `build` job above. If push-to-main releases
  # are required, route them through `workflow_dispatch` instead.
  # ---------------------------------------------------------------------------
