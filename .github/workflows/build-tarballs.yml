name: Build Tarballs (autopg)

# Group 7 of autopg-distribution-cutover — produces per-platform tarballs
# bundling the autopg CLI + the matching postgres server binaries.
#
# This workflow runs on tag pushes and via manual dispatch. It uploads each
# tarball + outer .sha256 as a build artifact so Group 8 (cosign sign +
# SLSA attest) and Group 9 (CDN publish) can consume them in downstream
# workflows.
#
# Release chain: build-tarballs → sign-attest → release-publish. Each hop is
# an explicit `gh workflow run --ref <tag>` (see `kick-sign-attest` below),
# never `workflow_run`.
#
# Matrix: 5 platforms — linux-x64-glibc, linux-x64-musl, linux-arm64,
# darwin-x64, darwin-arm64. Each job runs the same three-stage pipeline:
#
#   1. scripts/build-binary.sh        → dist/<pf>/autopg/autopg
#   2. scripts/fetch-postgres-bins.sh → dist/<pf>/autopg/postgres/{bin,share}/
#   3. scripts/assemble-tarball.sh    → dist/autopg-<ver>-<pf>.tar.gz
#
# A separate `smoke` job runs the fixture-based smoke test against the
# scripts independent of real binaries — gates every PR.

on:
  push:
    tags:
      - 'v*'
      - 'autopg-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (default: package.json)'
        required: false
        type: string
      pg_pkg_version:
        description: '@embedded-postgres/<pf> version'
        required: false
        type: string
        default: '18.3.0-beta.17'
      release:
        description: 'Continue the release chain (sign-attest, then a public release-publish) after the build'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/build-binary.sh'
      - 'scripts/fetch-postgres-bins.sh'
      - 'scripts/assemble-tarball.sh'
      - 'tests/integration/tarball-smoke.sh'
      - 'tests/integration/sign-attest-smoke.sh'
      - '.github/workflows/build-tarballs.yml'
      - '.github/workflows/sign-attest.yml'
      - '.github/workflows/release-publish.yml'

concurrency:
  group: build-tarballs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Smoke (fixture-based) — runs on every PR + dispatch. Validates the
  # script pipeline shape without requiring bun or @embedded-postgres on
  # the runner.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64-glibc
          - linux-x64-musl
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint scripts
        run: |
          shellcheck -S warning \
            scripts/build-binary.sh \
            scripts/fetch-postgres-bins.sh \
            scripts/assemble-tarball.sh \
            scripts/aggregate-manifest.sh \
            scripts/verify-published-artifacts.sh \
            tests/integration/tarball-smoke.sh \
            tests/integration/sign-attest-smoke.sh

      - name: Run fixture smoke
        run: bash tests/integration/tarball-smoke.sh --fixture --platform ${{ matrix.platform }}

  # ---------------------------------------------------------------------------
  # Sign + Attest (fixture) — exercises Group 8's cosign + manifest +
  # verify scripts using the test-only fixture keypair. Gates every PR.
  # ---------------------------------------------------------------------------
  sign-attest-smoke:
    name: Sign + Attest (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'
      - name: Run sign-attest fixture smoke
        run: bash tests/integration/sign-attest-smoke.sh

  # ---------------------------------------------------------------------------
  # Distribution model: GitHub Releases (Felipe directive 2026-05-08).
  # The cdn.automagik.dev publish job has been replaced with `gh release
  # upload` — see .github/workflows/release-publish.yml. GitHub's Fastly
  # CDN handles distribution; cosign signatures live in Sigstore Rekor
  # (storage-agnostic). No bucket, no DNS, no cache-control gymnastics.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Build (real) — runs on tag pushes + dispatch. Builds + bundles real
  # tarballs and uploads them as artifacts for downstream signing.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-glibc
            runner:   ubuntu-latest
          # linux-x64-musl dropped: @embedded-postgres publishes NO musl
          # build (only glibc linux-x64 + linux-arm64), and no
          # AUTOPG_POSTGRES_URL_TEMPLATE repo var is configured, so every
          # musl fetch died "no @embedded-postgres pkg ... set
          # AUTOPG_POSTGRES_URL_TEMPLATE". A missing artifact also sinks
          # sign-attest's aggregate (same failure mode as darwin-x64).
          # Re-add when a musl postgres source (URL template / self-hosted
          # cache) exists — tracked follow-up.
          - platform: linux-arm64
            # GitHub-hosted ARM64 runners; falls back to QEMU emulation
            # if the org has not yet enabled ubuntu-24.04-arm runners.
            runner:   ubuntu-24.04-arm
          # BRIEF-v3-build-fix Bug #2: darwin-x64 is intentionally NOT in
          # this matrix. Its only viable hosted runner is `macos-13` (the
          # last Intel macOS image — macos-14/15 are Apple Silicon), and
          # the org's macOS runners are chronically unavailable, so the job
          # sat `queued` forever holding the run-level conclusion `null`.
          # That masked real failures AND, because a missing
          # `autopg-*-darwin-x64` artifact fails sign-attest's `aggregate`
          # (needs:[sign], no `if: always()`), it silently sank the entire
          # signed-release chain. Dropping it lets the 4 buildable
          # platforms publish a real signed release. Intel-macOS support is
          # a tracked follow-up (re-add with a self-hosted/available Intel
          # runner, or cross-build darwin-x64 + sign on darwin-arm64).
          - platform: darwin-arm64
            runner:   macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # Stage 1 — compile autopg.
      # Fallback (pkg/nexe) is enabled per the wish G7 contract; bun is
      # the primary, the fallback is documented in build.log.
      - name: Build autopg binary
        shell: bash
        env:
          AUTOPG_BUILD_FALLBACK: '1'
        run: bash scripts/build-binary.sh --platform ${{ matrix.platform }} --version ${{ steps.ver.outputs.version }}

      # Stage 2 — fetch postgres bins.
      # @embedded-postgres covers linux-x64-glibc + darwin-{x64,arm64}.
      # linux-x64-musl + linux-arm64 require AUTOPG_POSTGRES_URL_TEMPLATE
      # (passed via repo secret in production) or AUTOPG_POSTGRES_LOCAL_DIR
      # in a self-hosted runner cache. Failure here is loud, not silent.
      - name: Fetch postgres bins
        shell: bash
        env:
          AUTOPG_POSTGRES_PKG_VERSION:  ${{ inputs.pg_pkg_version || '18.3.0-beta.17' }}
          AUTOPG_POSTGRES_URL_TEMPLATE: ${{ vars.AUTOPG_POSTGRES_URL_TEMPLATE }}
        run: bash scripts/fetch-postgres-bins.sh --platform ${{ matrix.platform }}

      # Stage 3 — assemble the tarball + emit outer .sha256.
      - name: Assemble tarball
        shell: bash
        run: bash scripts/assemble-tarball.sh --platform ${{ matrix.platform }} --version ${{ steps.ver.outputs.version }}

      # Stage 4 — gate via the real-mode smoke test.
      - name: Smoke real tarball
        shell: bash
        run: bash tests/integration/tarball-smoke.sh --real --platform ${{ matrix.platform }} --version ${{ steps.ver.outputs.version }}

      - name: Verify size band (50–80MB)
        shell: bash
        run: |
          TARBALL="dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz"
          SIZE_MB=$(du -m "$TARBALL" | cut -f1)
          echo "Tarball size: ${SIZE_MB}MB"
          if [[ "$SIZE_MB" -lt 30 || "$SIZE_MB" -gt 120 ]]; then
            echo "::error::tarball size out of expected band (got ${SIZE_MB}MB; expected 30-120MB sanity-band)"
            exit 1
          fi

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz.sha256
            dist/build.log
            dist/build-record.tsv
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Hand off to sign-attest — explicit dispatch, at the tag.
  #
  # This hop used to be a `workflow_run` trigger on sign-attest.yml. That can
  # not work for a release:
  #   1. release.yml starts this workflow with GITHUB_TOKEN, and GitHub raises
  #      no follow-on events for a GITHUB_TOKEN-started run — sign-attest never
  #      fired. Every release from v3.0.4 to v3.1.0 stalled here until someone
  #      dispatched the next two workflows by hand; v3.1.0 sat unpublished for
  #      17 days.
  #   2. a `workflow_run` run executes at the default branch, so cosign would
  #      sign as sign-attest.yml@refs/heads/main — an identity the consumer
  #      trust regex in src/cosign/trust-list.js (…@refs/tags/v.*) rejects.
  # `workflow_dispatch` is exempt from (1) and `--ref <tag>` fixes (2).
  #
  # Runs for dispatches that ask for it (`release: true`, which release.yml
  # passes) and for a pushed plain `vX.Y.Z` tag. A plain manual rebuild of an
  # old tag stops here, so it can not republish that version or move
  # latest.json back. So does a pushed prerelease (`v1.2.3-rc.1`) or `autopg-v*`
  # tag: the chain publishes to the stable channel, and the trust regex only
  # accepts signatures made at `refs/tags/v*`.
  # ---------------------------------------------------------------------------
  kick-sign-attest:
    name: Dispatch sign-attest at the tag
    needs: [build]
    if: >-
      github.ref_type == 'tag' &&
      (inputs.release ||
       (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # `gh workflow run` creates a workflow_dispatch event
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Dispatch sign-attest.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh workflow run sign-attest.yml \
               --repo "${{ github.repository }}" \
               --ref "${TAG}" \
               -f version="${VERSION}" \
               -f run_id="${{ github.run_id }}" \
               -f publish=true; then
            echo "::notice::dispatched sign-attest.yml @ ${TAG} (version=${VERSION}, run_id=${{ github.run_id }})"
          else
            echo "::error::could not dispatch sign-attest.yml — the release chain stops here. Recover with: gh workflow run sign-attest.yml --ref ${TAG} -f version=${VERSION} -f run_id=${{ github.run_id }} -f publish=true"
            exit 1
          fi
