# ============================================================================
# release-publish.yml — GitHub Releases distribution (Felipe directive 2026-05-08).
#
# Replaces cutover G9's cdn.automagik.dev publish workflow. GitHub Releases
# is free, maintained by GitHub, and `gh attestation verify` reads cosign
# signatures from Sigstore Rekor without any custom verification server.
#
# Trigger: workflow_dispatch only. For a release, sign-attest.yml's
# `kick-release-publish` job dispatches this once signing has verified, passing
# its own run id as `sign_run_id` — so the signing artifacts always exist
# BEFORE release-publish attempts to attach them. There is no `workflow_run`
# trigger: it never fired after a GITHUB_TOKEN-started sign-attest run, which
# left tagged versions unpublished.
#
# Pipeline:
#   1. Download `autopg-signed-bundle-<version>` aggregate artifact from the
#      sign-attest.yml run named by `sign_run_id` (contains tarballs + sha256 +
#      sig + cert + intoto.jsonl + manifest.json — everything in one fetch)
#   2. Sanity-check: every tarball must have its sig + cert + intoto.jsonl
#      + sha256 siblings before any release upload happens
#   3. Create GitHub Release (draft until manual promotion) with all assets
#   4. Update `<channel>.json` channel pointer in the repo (committed, served via
#      raw.githubusercontent.com — install.sh reads this for stable/homolog/dev
#      resolution; stable maps to latest.json for v1-manifest back-compat)
#
# Verification by consumers:
#   gh release download v<version> --repo automagik-dev/autopg --pattern '*.tar.gz'
#   pgserve verify autopg-<v>-<platform>.tar.gz
#   # OR raw cosign keyless:
#   cosign verify-blob \
#     --certificate-identity-regexp '^https://github.com/automagik-dev/autopg/.github/workflows/sign-attest.yml@refs/tags/v.*$' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --signature autopg-<v>-<platform>.tar.gz.sig \
#     --certificate autopg-<v>-<platform>.tar.gz.cert \
#     autopg-<v>-<platform>.tar.gz
# ============================================================================

name: release-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.6.2)'
        required: true
      sign_run_id:
        description: |
          Workflow run ID of the upstream "Sign + Attest Tarballs (autopg)"
          run that produced the autopg-signed-bundle-<version> artifact.
          Find it via:
            gh run list --workflow "Sign + Attest Tarballs (autopg)" --limit 5
          sign-attest.yml fills this in when it dispatches a release.
        required: true
      channel:
        description: 'Release channel'
        required: true
        type: choice
        default: stable
        # Canonical channel taxonomy (Felipe directive 2026-05-12, unified
        # across pgserve/omni/genie): stable / homolog / dev. beta + canary
        # have been retired. pgserve in practice only uses `stable` (main
        # branch); homolog + dev are listed for cross-repo taxonomy parity
        # and operator-dispatch capability if a future workflow needs them.
        options:
          - stable
          - homolog
          - dev
      draft:
        description: 'Create as draft (require manual promotion)?'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

permissions:
  contents: write              # gh release create
  id-token: write              # cosign keyless OIDC (if re-signing)
  attestations: write          # actions/attest-build-provenance@v1
  actions: read                # cross-run download via `run-id` requires
                               # this — when an explicit permissions block
                               # is present, unlisted scopes are denied,
                               # so we must enumerate every scope we use.

jobs:
  publish:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(node -p "require('./package.json').version")
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve channel
        id: ch
        run: |
          if [ -n "${{ inputs.channel }}" ]; then
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            # No channel given: stable.
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed bundle aggregate (sign-attest.yml)
        uses: actions/download-artifact@v4
        with:
          # sign-attest.yml's aggregate job uploads ONE artifact named
          # `autopg-signed-bundle-<version>` containing every per-platform
          # tarball + sha256 + sig + cert + intoto.jsonl + manifest.json.
          # Single download replaces the prior pair of broken patterns
          # (`autopg-*-tarball`, `autopg-*-signed`) that didn't match
          # any real artifact name.
          name: autopg-signed-bundle-${{ steps.ver.outputs.version }}
          path: dist/
          # Cross-workflow downloads need the upstream run-id +
          # github-token; the run-id arrives as the `sign_run_id` input.
          run-id: ${{ inputs.sign_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets
        run: |
          echo "=== dist/ ==="
          ls -la dist/ || true

      - name: Sanity-check signed bundle siblings (Wave A PR-A2 D8)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          MISSING=0
          shopt -s nullglob
          TARBALLS=(dist/autopg-${VERSION}-*.tar.gz)
          if [ ${#TARBALLS[@]} -eq 0 ]; then
            echo "::error::no autopg-${VERSION}-*.tar.gz tarballs in dist/ — sign-attest bundle is empty"
            exit 1
          fi
          for tb in "${TARBALLS[@]}"; do
            for ext in sig cert intoto.jsonl sha256; do
              if [ ! -f "${tb}.${ext}" ]; then
                echo "::error::missing ${tb}.${ext}"
                MISSING=$((MISSING + 1))
              fi
            done
          done
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} required sibling files missing — refusing to publish a release without signing material"
            exit 1
          fi
          echo "::notice::all ${#TARBALLS[@]} tarballs have complete sig + cert + intoto.jsonl + sha256 siblings"

      - name: Create GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ch.outputs.channel }}
          DRAFT_FLAG: ${{ inputs.draft && '--draft' || '' }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create release if it doesn't exist; else upload assets to existing.
          if ! gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "v${VERSION}" \
              --notes "Release v${VERSION} (channel: ${CHANNEL})" \
              ${DRAFT_FLAG} ${PRERELEASE_FLAG}
          fi

          # Upload all dist/* assets (--clobber overwrites if re-running)
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            gh release upload "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/*
          else
            echo "::warning::dist/ is empty — no assets to upload"
          fi

      # ---------------------------------------------------------------------
      # Per-channel manifest pointers — committed to main so install.sh +
      # `autopg update` can resolve the current version for each channel via:
      #   curl -fsSL https://raw.githubusercontent.com/<repo>/main/.well-known/<channel>.json
      #
      # Filename map (canonical taxonomy per Felipe directive 2026-05-12,
      # unified across pgserve/omni/genie — beta + canary retired):
      #   stable  → latest.json    (kept for back-compat with v1 manifest layout)
      #   homolog → homolog.json   (homologation/staging — operator-dispatch only on pgserve)
      #   dev     → dev.json       (development — operator-dispatch only on pgserve)
      #
      # Pgserve in practice ships only from main → `stable`. The autopg cohort
      # has no dev branch, no auto-version workflow, and no development-channel
      # consumers — homolog + dev are present for cross-repo taxonomy parity
      # and ad-hoc operator dispatches (e.g., for ad-hoc autopg test releases).
      # The genie-style "stable also advances dev.json" behavior is omitted
      # because pgserve has no continuous dev-branch release stream that
      # consumers track.
      #
      # The stable-only gate that lived here previously was lifted — every
      # non-draft publish writes the manifest for its channel. The
      # case-statement keeps the same code shape as omni/genie for
      # cross-repo readability.
      # ---------------------------------------------------------------------
      - name: Update channel manifests (.well-known/*.json — non-draft only)
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ch.outputs.channel }}
        run: |
          set -euo pipefail
          # stable keeps the historical filename `latest.json`; every other
          # channel uses its own name. install.sh + autopg update consume
          # the same convention. Unlike omni/genie which auto-advance
          # dev.json on stable releases (single-pipeline reality), pgserve
          # has no continuous dev-branch release stream — homolog + dev are
          # operator-dispatch-only paths here.
          declare -A MANIFEST_FILES=()
          case "$CHANNEL" in
            stable)  MANIFEST_FILES[stable]="latest.json" ;;
            homolog) MANIFEST_FILES[homolog]="homolog.json" ;;
            dev)     MANIFEST_FILES[dev]="dev.json" ;;
            *)
              echo "::error::unknown channel: $CHANNEL (valid: stable, homolog, dev)"
              exit 1
              ;;
          esac

          # Commit on top of main's current tip, not this run's checkout. The
          # run is checked out at the release tag, and by the time a release
          # is published main may have moved past it — pushing a child of the
          # tag to main would then be rejected as non-fast-forward.
          git fetch --no-tags --depth=1 origin main
          git switch --detach FETCH_HEAD

          mkdir -p .well-known
          for manifest_channel in "${!MANIFEST_FILES[@]}"; do
            FILE="${MANIFEST_FILES[$manifest_channel]}"
            cat > ".well-known/${FILE}" <<EOF
          {
            "schema_version": 1,
            "channel": "${manifest_channel}",
            "version": "${VERSION}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tarball_base": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}",
            "platforms": ["linux-x64-glibc","linux-arm64","darwin-arm64"]
          }
          EOF
          done

          git config user.name "release-bot"
          git config user.email "release-bot@namastex.com"
          # Stage first, then compare against HEAD. `git diff --quiet <path>`
          # returns 0 (no diff) for *untracked* files because they aren't in
          # the index — staging registers the path; then
          # `git diff --cached --quiet HEAD --` correctly reports "differs
          # from HEAD" for both new and modified files. Mirrors the
          # bootstrap fix from genie PR #2412/#2419.
          MANIFEST_PATHS=()
          for f in "${MANIFEST_FILES[@]}"; do
            MANIFEST_PATHS+=(".well-known/${f}")
          done
          git add "${MANIFEST_PATHS[@]}"
          if git diff --cached --quiet HEAD -- "${MANIFEST_PATHS[@]}"; then
            echo "manifests unchanged — nothing to commit"
            exit 0
          fi
          MANIFEST_LIST=$(IFS=','; echo "${!MANIFEST_FILES[*]}")
          git commit -m "chore(release): update manifests (${MANIFEST_LIST}) → v${VERSION}"
          # main can move between the fetch above and this push. The commit
          # only touches .well-known/, so replaying it on the new tip is safe.
          MANIFEST_COMMIT=$(git rev-parse HEAD)
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "::warning::manifest push attempt ${attempt} rejected — replaying on main's new tip"
            git fetch --no-tags --depth=1 origin main
            git switch --detach FETCH_HEAD
            git cherry-pick "${MANIFEST_COMMIT}" || { git cherry-pick --abort || true; break; }
          done
          # A release whose manifest never lands is invisible to install.sh
          # and `autopg update`, so this must not pass quietly.
          if [ "${PUSHED}" -ne 1 ]; then
            echo "::error::v${VERSION} is published, but pushing ${MANIFEST_PATHS[*]} to main failed — update it manually or install.sh + autopg update keep resolving the previous version"
            exit 1
          fi
