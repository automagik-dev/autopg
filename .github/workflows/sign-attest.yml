name: Sign + Attest Tarballs (autopg)

# Group 8 of autopg-distribution-cutover — signs every tarball produced
# by build-tarballs.yml with cosign keyless OIDC + emits a SLSA L3 build-
# provenance attestation per platform, then aggregates a top-level
# manifest.json for release-publish.yml to consume.
#
# Trigger: workflow_dispatch at the release tag — build-tarballs.yml's
# `kick-sign-attest` job does this for a release; an operator can too. Also
# usable as a callable workflow.
#
# There is deliberately no `workflow_run` trigger: such a run executes at the
# default branch, so the certificate would say …@refs/heads/main and every
# consumer would reject it (see the trust regex note below).
#
# Signing is cosign keyless (OIDC via GitHub Actions). No secrets
# required; the id-token: write permission below mints OIDC tokens on
# demand. The Fulcio cert subject encodes
# `<repo>/.github/workflows/sign-attest.yml@<ref>`, which is what
# `src/cosign/trust-list.js` anchors `automagik-pgserve-release`
# against (refs/tags/v.* under post-Wave-A binding).
#
# Outputs (uploaded as a single artifact `autopg-signed-bundle`):
#   dist/autopg-<version>-<platform>.tar.gz
#   dist/autopg-<version>-<platform>.tar.gz.sha256
#   dist/autopg-<version>-<platform>.tar.gz.sig
#   dist/autopg-<version>-<platform>.tar.gz.cert
#   dist/autopg-<version>-<platform>.tar.gz.intoto.jsonl
#   dist/manifest.json

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sign (must match upstream build artifacts)'
        required: true
        type: string
      run_id:
        description: 'build-tarballs.yml run ID to download artifacts from'
        required: false
        type: string
      publish:
        description: 'Continue the release chain: dispatch a public, stable release-publish once signing verifies'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: 'Version to sign'
        required: true
        type: string
      run_id:
        description: 'upstream run id'
        required: false
        type: string
    # Wave A (v2.6.x) — keyless OIDC: no secrets required.
    # The id-token: write permission below mints OIDC tokens on demand;
    # cosign sign-blob exchanges them for a Fulcio cert at signing time.

concurrency:
  group: sign-attest-${{ github.ref }}-${{ inputs.version || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write       # OIDC token for SLSA provenance
  attestations: write   # actions/attest-build-provenance@v1

jobs:
  # ---------------------------------------------------------------------------
  # sign — per-platform: cosign sign-blob + attest-build-provenance.
  # ---------------------------------------------------------------------------
  sign:
    name: Sign ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64-glibc
          # linux-x64-musl dropped in lockstep with build-tarballs.yml
          # (no @embedded-postgres musl package). A download-artifact for a
          # tarball that was never built fails this leg and skips aggregate.
          - linux-arm64
          # darwin-x64 dropped in lockstep with build-tarballs.yml — see
          # the Bug #2 comment there. A `download-artifact` for a tarball
          # build-tarballs never produced would fail this matrix leg, and
          # the `aggregate` job (needs:[sign]) would be skipped, taking the
          # whole release-publish chain down with it.
          - darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: dist
          # Cross-workflow downloads need the run-id of the upstream
          # build-tarballs job; workflow_dispatch / workflow_call accept it
          # as input.
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Verify outer SHA256 before signing
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TARBALL="dist/autopg-${VERSION}-${PLATFORM}.tar.gz"
          [[ -f "${TARBALL}" ]]        || { echo "::error::missing ${TARBALL}";        exit 1; }
          [[ -f "${TARBALL}.sha256" ]] || { echo "::error::missing ${TARBALL}.sha256"; exit 1; }
          RECORDED=$(awk '{print $1}' "${TARBALL}.sha256")
          ACTUAL=$(sha256sum "${TARBALL}" | awk '{print $1}')
          if [[ "${RECORDED}" != "${ACTUAL}" ]]; then
            echo "::error::sha256 mismatch (recorded=${RECORDED} actual=${ACTUAL})"
            exit 1
          fi
          echo "sha256 match: ${ACTUAL}  ${TARBALL}"

      - name: cosign sign-blob (keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: "true"
          VERSION:  ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TARBALL="dist/autopg-${VERSION}-${PLATFORM}.tar.gz"
          SIG="${TARBALL}.sig"
          CERT="${TARBALL}.cert"

          # Keyless OIDC: cosign exchanges the workflow's id-token for a
          # short-lived Fulcio certificate. The cert subject encodes the
          # workflow path + ref, which trust-list.js anchors against.
          cosign sign-blob \
            --yes \
            --output-signature "${SIG}" \
            --output-certificate "${CERT}" \
            "${TARBALL}"

          echo "::notice::signed ${TARBALL} (keyless) -> ${SIG} + ${CERT}"

      - name: cosign verify-blob (self-check)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TARBALL="dist/autopg-${VERSION}-${PLATFORM}.tar.gz"
          # Keyless verify: anchor on this workflow's own path + a
          # permissive ref-tail (covers tag refs in production runs and
          # branch refs when an operator dispatches from a branch). The strict
          # consumer-facing trust regex in src/cosign/trust-list.js
          # tightens this to refs/tags/v.*.
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/sign-attest.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --signature "${TARBALL}.sig" \
            --certificate "${TARBALL}.cert" \
            "${TARBALL}"

      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz

      - name: Stage provenance bundle next to tarball
        shell: bash
        env:
          VERSION:  ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE:   ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          DEST="dist/autopg-${VERSION}-${PLATFORM}.tar.gz.intoto.jsonl"
          if [[ -z "${BUNDLE}" || ! -f "${BUNDLE}" ]]; then
            echo "::error::attest-build-provenance did not produce a bundle"
            exit 1
          fi
          cp "${BUNDLE}" "${DEST}"
          ls -la "${DEST}"
          echo "::notice::provenance: ${DEST}"

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: autopg-signed-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz.sha256
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz.sig
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz.cert
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz.intoto.jsonl
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # aggregate — merge per-platform metadata into manifest.json + verify all.
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate manifest + verify all
    runs-on: ubuntu-latest
    needs: [sign]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all signed bundles
        uses: actions/download-artifact@v4
        with:
          pattern: autopg-signed-${{ steps.ver.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      # slsa-verifier removed: it only verifies slsa-github-generator
      # (intoto:0.0.2) provenance and rejects every actions/attest-build-
      # provenance bundle ("unexpected tlog entry type: got dsse:0.0.1").
      # verify-published-artifacts.sh now uses `gh attestation verify`
      # (gh is preinstalled on GitHub runners).

      - name: Aggregate manifest.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash scripts/aggregate-manifest.sh --version "${VERSION}"
          cat dist/manifest.json

      - name: Verify everything
        shell: bash
        env:
          AUTOPG_SOURCE_URI: github.com/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}   # gh attestation verify (provenance gate)
        run: |
          bash scripts/verify-published-artifacts.sh dist/

      - name: Fail if any tarball lacks sig + cert + provenance
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          MISSING=0
          for f in dist/autopg-${VERSION}-*.tar.gz; do
            for ext in sig cert intoto.jsonl sha256; do
              if [[ ! -f "${f}.${ext}" ]]; then
                echo "::error::missing ${f}.${ext}"
                MISSING=$((MISSING + 1))
              fi
            done
          done
          if [[ "${MISSING}" -gt 0 ]]; then
            echo "::error::${MISSING} required sibling files missing — block release"
            exit 1
          fi

      - name: Upload aggregated bundle (handoff to release-publish)
        uses: actions/upload-artifact@v4
        with:
          name: autopg-signed-bundle-${{ steps.ver.outputs.version }}
          path: |
            dist/autopg-${{ steps.ver.outputs.version }}-*.tar.gz
            dist/autopg-${{ steps.ver.outputs.version }}-*.tar.gz.sha256
            dist/autopg-${{ steps.ver.outputs.version }}-*.tar.gz.sig
            dist/autopg-${{ steps.ver.outputs.version }}-*.tar.gz.cert
            dist/autopg-${{ steps.ver.outputs.version }}-*.tar.gz.intoto.jsonl
            dist/manifest.json
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Hand off to release-publish — explicit dispatch, at the tag. Same reasoning
  # as `kick-sign-attest` in build-tarballs.yml: a `workflow_run` hop never
  # fires after a GITHUB_TOKEN-started run.
  #
  # Only when the caller asked for it (`publish: true`, which build-tarballs
  # passes for a release). Re-signing an old tag by hand stops here.
  # ---------------------------------------------------------------------------
  kick-release-publish:
    name: Dispatch release-publish at the tag
    needs: [aggregate]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # `gh workflow run` creates a workflow_dispatch event
    steps:
      - name: Dispatch release-publish.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh workflow run release-publish.yml \
               --repo "${{ github.repository }}" \
               --ref "${TAG}" \
               -f version="${VERSION}" \
               -f sign_run_id="${{ github.run_id }}" \
               -f channel=stable \
               -f draft=false; then
            echo "::notice::dispatched release-publish.yml @ ${TAG} (version=${VERSION}, sign_run_id=${{ github.run_id }})"
          else
            echo "::error::could not dispatch release-publish.yml — v${VERSION} is signed but NOT published. Recover with: gh workflow run release-publish.yml --ref ${TAG} -f version=${VERSION} -f sign_run_id=${{ github.run_id }} -f channel=stable -f draft=false"
            exit 1
          fi
